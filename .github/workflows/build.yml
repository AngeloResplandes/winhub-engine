name: Build engine

# Every push and pull request builds the engine and runs the smoke test.
# Pushing a tag "wine-<version>-r<revision>" (matching versions.env) also publishes a release.
# Changes to documentation only (docs, book, Markdown, the docs workflow) do not build the engine.
on:
  push:
    branches: [main]
    tags: ['wine-*']
    paths-ignore: ["**.md", "docs/**", "book/**", ".github/workflows/docs.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "book/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  llvm:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - name: Versão do LLVM
        run: grep '^LLVM_COMMIT=' versions.env >> "$GITHUB_ENV"
      - name: Cache do LLVM
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: work/llvm-darwin
          key: llvm-darwin-x86_64-${{ env.LLVM_COMMIT }}
          lookup-only: true
      - name: Ferramentas
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja
      - name: Compilar o LLVM 15 (x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-llvm.sh
      - name: Guardar o LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: work/llvm-darwin
          key: llvm-darwin-x86_64-${{ env.LLVM_COMMIT }}

  engine:
    needs: llvm
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - name: Versões
        run: grep -E '^(LLVM_COMMIT|ENGINE_REVISION|WINE_VERSION|CROSSOVER_VERSION|PCRE2_SHA256|PCRE2_WRAP_SHA256|WINE_BASE_SHA256|GVDB_COMMIT)=' versions.env >> "$GITHUB_ENV"
      - name: Rosetta 2
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Ferramentas
        run: brew install mingw-w64 bison meson ninja freetype gnutls sdl2 glslang pkgconf gettext
      - name: Testes do winhubcompat
        run: ./scripts/test-compatdb.sh
      - name: Assinatura do banco de compatibilidade
        run: swift scripts/compatdb.swift verify
      - name: Restaurar o LLVM
        uses: actions/cache/restore@v5
        with:
          path: work/llvm-darwin
          key: llvm-darwin-x86_64-${{ env.LLVM_COMMIT }}
          fail-on-cache-miss: true
      # build-wine.sh needs gstreamer-install and gst-deps (libffi.pc, libintl); package.sh copies the licenses
      # from gst-src and archives gvdb and the pcre2 files for the release sources.
      - name: Restaurar o GStreamer
        id: gst-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            work/gstreamer-install
            work/gst-src
            work/gst-deps
            work/gvdb
            work/downloads/pcre2*
          key: gstreamer-x86_64-${{ env.CROSSOVER_VERSION }}-${{ env.PCRE2_SHA256 }}-${{ env.PCRE2_WRAP_SHA256 }}-${{ env.WINE_BASE_SHA256 }}-${{ env.GVDB_COMMIT }}-${{ hashFiles('scripts/build-gstreamer.sh') }}
      - name: GLib e GStreamer (vídeos dos jogos)
        if: steps.gst-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-gstreamer.sh
      - name: Guardar o GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            work/gstreamer-install
            work/gst-src
            work/gst-deps
            work/gvdb
            work/downloads/pcre2*
          key: gstreamer-x86_64-${{ env.CROSSOVER_VERSION }}-${{ env.PCRE2_SHA256 }}-${{ env.PCRE2_WRAP_SHA256 }}-${{ env.WINE_BASE_SHA256 }}-${{ env.GVDB_COMMIT }}-${{ hashFiles('scripts/build-gstreamer.sh') }}
      - name: Wine (fontes LGPL do CrossOver + patches)
        run: ./scripts/build-wine.sh
      - name: winhubcompat
        run: ./scripts/build-winhubcompat.sh
      - name: DXMT
        run: ./scripts/build-dxmt.sh
      - name: DXVK
        run: ./scripts/build-dxvk.sh
      - name: cabextract
        run: ./scripts/build-cabextract.sh
      - name: Empacotar
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: winhub-engine-${{ github.sha }}
          path: work/dist
      - name: Teste de fumaça (D3D11 via DXMT e DXVK, vídeo H.264/AAC pelo Media Foundation)
        run: ./scripts/smoke-test.sh
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/wine-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="wine-${WINE_VERSION}-r${ENGINE_REVISION}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com versions.env ($expected)." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" work/dist/* \
            --title "Wine $WINE_VERSION (CrossOver sources) + WinHub r$ENGINE_REVISION" \
            --notes-file work/dist/winhub-manifests.json
